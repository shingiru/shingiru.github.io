<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CW Narrow Filter Test</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101518;color:#e6edef;font:14px system-ui}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}section{border-top:1px solid #344147;padding:18px 0}.controls{display:flex;gap:16px;align-items:end;flex-wrap:wrap}label{display:grid;gap:7px}input,select,button{font:inherit;color:inherit;background:#202b30;border:1px solid #536269;border-radius:4px;padding:8px}button{cursor:pointer}button:disabled{opacity:.4}input[type=range]{padding:0;width:180px}input[type=number]{width:110px}#tune{width:100%}canvas{display:block;width:100%;height:100px;background:#171f23}.station{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #29353a;cursor:pointer}.station.selected{color:#6ce1bd}.station.out{opacity:.45}.station canvas{height:32px}small{color:#a2b3ba}#detail{min-height:66px;overflow-wrap:anywhere}#status{color:#efbd73}button.primary{background:#225a4d}@media(max-width:600px){main{padding:14px}.station{grid-template-columns:1fr;gap:5px}.controls{gap:12px}h1{font-size:23px}}
#spectrum{touch-action:pan-y;cursor:grab;user-select:none}#spectrum.dragging{cursor:grabbing}
</style>
<main><h1>CW Narrow Filter Test</h1><section class="controls"><button id="start" class="primary">▶ Start</button><button id="stop" disabled>■ Stop</button><label>Bandwidth<select id="band"><option value="2400">2.4 kHz</option><option value="3000">3 kHz</option><option value="6000">6 kHz</option><option value="12000">12 kHz</option></select></label><label>Volume<input id="volume" type="range" min="0" max="1" step=".01" value=".25"></label><span id="status">Stopped</span></section>
<section><div class="controls"><label>Receiver tuning (Hz)<input id="tuning" type="number" min="-1200" max="10000" step="10" value="0"></label><button id="minus">−10</button><button id="plus">+10</button><label>Reference tone (Hz)<input id="pitch" type="number" min="300" max="1000" step="10" value="600"></label><button id="align">◎ Tune to station</button></div><input id="tune" aria-label="Receiver tuning" type="range" min="-1200" max="10000" step="10" value="0"><canvas id="spectrum"></canvas><div id="detail"></div></section>
<section class="controls"><label>QSO mode<select id="mode"><option value="contest">Contest</option><option value="normal">Standard QSO</option></select></label><label>Station count<input id="count" type="number" min="44" max="46" value="44"></label><label>Min WPM<input id="low" type="number" min="5" max="50" value="15"></label><label>Max WPM<input id="high" type="number" min="5" max="50" value="35"></label><button id="generate">↻ Generate QSOs</button></section><div id="stations"></div></main>
<script>
const $=id=>document.getElementById(id), ids=['band','volume','tuning','pitch','mode','count','low','high'];
try{const saved=JSON.parse(localStorage.getItem('cw-filter-test')||'{}');ids.forEach(id=>{if(saved[id]!=null)$(id).value=saved[id]});if(Number(saved.count)<44)$('count').value=44}catch{}
const codes='. - ..'.split(' '), MORSE={};'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/=?.,'.split('').forEach((c,i)=>MORSE[c]='.- -... -.-. -.. . ..-. --. .... .. .--- -.- .-.. -- -. --- .--. --.- .-. ... - ..- ...- .-- -..- -.-- --.. ----- .---- ..--- ...-- ....- ..... -.... --... ---.. ----. -..-. -...- ..--.. .-.-.- --..--'.split(' ')[i]);
let ac,master,timer,stations=[],selected=0,running=false,sceneMode='contest';
const rand=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],call=()=>pick(['HL','JA','K','W','DL','VK','G'])+Math.floor(rand(0,10))+Array.from({length:3},()=>pick('ABCDEFGHIJKLMNOPQRSTUVWXYZ')).join('');
function number(id,min,max){const n=Number($(id).value);$(id).value=Math.max(min,Math.min(max,Number.isFinite(n)?n:min));return +$(id).value}
function tone(s){return +$('pitch').value+s.offset-(+$('tuning').value)}
function audible(f){return Math.max(0,Math.min(1,(f-200)/100,(200+(+$('band').value)-f)/100))}
function sentence(s){const other=call();return sceneMode==='contest'?`CQ TEST ${s.call} ${s.call} ${other} ${s.call} 5NN ${Math.floor(rand(1,999))} TU`:`CQ CQ DE ${s.call} K ${other} DE ${s.call} UR RST 579 NAME ${pick(['KIM','JOHN','TOM','LEE'])} QTH ${pick(['SEOUL','TOKYO','BERLIN','SYDNEY'])} HW CPY K TNX QSO 73 SK`}
function enqueue(s){s.text=sentence(s);const dot=1.2/s.wpm;let t=s.next;for(const word of s.text.split(' ')){for(const ch of word){for(const mark of MORSE[ch]||''){let d=dot*(mark==='.'?1:3);s.events.push({a:t,b:t+d,on:true,text:s.text});t+=d;s.events.push({a:t,b:t+dot,on:false});t+=dot} s.events.push({a:t,b:t+2*dot,on:false});t+=2*dot} s.events.push({a:t,b:t+4*dot,on:false});t+=4*dot} s.events.push({a:t,b:t+rand(1,4),on:false});s.next=s.events.at(-1).b}
function build(){const n=number('count',44,46),lo=number('low',5,50),hi=Math.max(lo,number('high',5,50));$('high').value=hi;sceneMode=$('mode').value;let gaps=Array(n-1).fill(1);for(let missing=46-n;missing>0;missing--){const candidates=gaps.map((gap,i)=>gap<3?i:-1).filter(i=>i>=0);gaps[pick(candidates)]++}let slots=[0];for(const gap of gaps)slots.push(slots.at(-1)+gap);stations=slots.sort((a,b)=>a-b).map(slot=>({call:call(),offset:300+500*slot+rand(-10,10)-600,wpm:Math.round(rand(lo,hi)),db:rand(-12,0),events:[],next:0}));selected=0;$('stations').innerHTML=stations.map((s,i)=>`<div class="station" data-i="${i}"><div><strong>${s.call}</strong> <small>${s.wpm} WPM · ${s.db.toFixed(1)} dB</small><div class="info"></div></div><canvas></canvas></div>`).join('');$('stations').querySelectorAll('.station').forEach(row=>row.onclick=()=>{selected=+row.dataset.i;$('tuning').value=Math.round(stations[selected].offset/10)*10;update()})}
function save(){try{localStorage.setItem('cw-filter-test',JSON.stringify(Object.fromEntries(ids.map(id=>[id,$(id).value]))))}catch{}}
function update(){number('pitch',300,1000);number('tuning',-1200,10000);$('tune').value=$('tuning').value;if(ac&&running){for(const s of stations){s.osc.frequency.setTargetAtTime(Math.max(1,Math.min(ac.sampleRate/2-1,tone(s))),ac.currentTime,.01);s.level.gain.setTargetAtTime(audible(tone(s))*10**(s.db/20)/47,ac.currentTime,.01)}master.gain.setTargetAtTime(+$('volume').value,ac.currentTime,.01);}save()}
async function start(){if(running)return;try{ac=new AudioContext();await ac.resume();if(ac.state!=='running')throw Error('Unable to start audio');master=ac.createGain();master.connect(ac.destination);for(const s of stations){s.osc=ac.createOscillator();s.key=ac.createGain();s.level=ac.createGain();s.key.gain.value=0;s.osc.connect(s.key).connect(s.level).connect(master);s.osc.start();s.events=[];s.next=ac.currentTime+rand(.1,2);s.scheduled=0}running=true;$('start').disabled=true;$('stop').disabled=false;update();ac.onstatechange=()=>{if(running&&ac.state!=='running')stop()};timer=setInterval(schedule,25);schedule()}catch(e){$('status').textContent=e.message;stop()}}
function schedule(){const now=ac.currentTime;for(const s of stations){if(s.next<now+.3)enqueue(s);for(const e of s.events){if(e.on&&e.a>=s.scheduled&&e.a<now+.2){const g=s.key.gain;g.setValueAtTime(0,e.a);g.linearRampToValueAtTime(1,e.a+.004);g.setValueAtTime(1,e.b-.004);g.linearRampToValueAtTime(0,e.b)}}s.scheduled=now+.2;s.events=s.events.filter(e=>e.b>now-12)}}
function stop(){running=false;clearInterval(timer);if(ac){ac.onstatechange=null;ac.close();ac=null}$('start').disabled=false;$('stop').disabled=true;$('status').textContent='Stopped'}
function canvas(c){const w=c.clientWidth,h=c.clientHeight;c.width=w*devicePixelRatio;c.height=h*devicePixelRatio;const g=c.getContext('2d');g.scale(devicePixelRatio,devicePixelRatio);return {g,w,h}}
function draw(){const now=ac?ac.currentTime:0;let heard=0;const {g,w,h}=canvas($('spectrum'));g.fillStyle='#233c36';g.fillRect(0,0,w*(+$('band').value)/12400,h);g.font='11px system-ui';for(let f=0;f<=12000;f+=2000){g.fillStyle='#a2b3ba';g.fillText(f/1000+'k',f/12400*w,95)}stations.forEach((s,i)=>{const f=tone(s),inBand=audible(f)>0,active=running&&s.events.some(e=>e.on&&e.a<=now&&e.b>now);if(inBand)heard++;g.fillStyle=i===selected?'#6ce1bd':'#efbd73';if(f>=0&&f<=12400)g.fillRect(f/12400*w,active?12:40,3,active?55:27);const row=$('stations').children[i];row.classList.toggle('selected',i===selected);row.classList.toggle('out',!inBand);row.querySelector('.info').textContent=`${Math.round(f/100)*100} Hz · ${!inBand?'Out of band':active?'Transmitting':'Idle'}`;const c=canvas(row.querySelector('canvas'));let x=c.w;for(let j=s.events.length-1;j>=0;j--){const e=s.events[j];if(e.a>now)continue;const d=Math.min(e.b,now)-e.a;let width=Math.min(d,e.on?100:18/s.wpm)*90;x-=width;c.g.fillStyle=e.on?'#6ce1bd':'#263236';c.g.fillRect(x,e.on?9:15,width,e.on?14:2);if(x<0)break}});g.fillStyle='#ffffff';g.fillRect(+$('pitch').value/12400*w,0,1,75);const s=stations[selected];if(s){const e=s.events.find(e=>e.on&&e.a<=now&&e.b>now);$('detail').textContent=`${s.call} · Offset ${Math.round((tone(s)-+$('pitch').value)/100)*100} Hz\n${e?e.text:''}`}if(running)$('status').textContent=`Playing · ${heard}/${stations.length} stations`;requestAnimationFrame(draw)}
$('start').onclick=start;$('stop').onclick=stop;$('generate').onclick=()=>{const resume=running;stop();build();save();if(resume)start()};ids.forEach(id=>$(id).oninput=update);$('tune').oninput=()=>{$('tuning').value=$('tune').value;update()};$('minus').onclick=()=>{$('tuning').value=+$('tuning').value-10;update()};$('plus').onclick=()=>{$('tuning').value=+$('tuning').value+10;update()};$('align').onclick=()=>{$('tuning').value=Math.round(stations[selected].offset/10)*10;update()};build();update();draw();

const spectrum=$('spectrum');
let drag=null;
spectrum.setAttribute('aria-label','Frequency spectrum, drag horizontally to tune');
spectrum.onpointerdown=e=>{
 if(!e.isPrimary||e.button!==0)return;
 drag={id:e.pointerId,x:e.clientX,tuning:+$('tuning').value,width:spectrum.getBoundingClientRect().width};
 spectrum.setPointerCapture(e.pointerId);
 spectrum.classList.add('dragging');
};
spectrum.onpointermove=e=>{
 if(!drag||drag.id!==e.pointerId)return;
 $('tuning').value=Math.round((drag.tuning-(e.clientX-drag.x)*12400/drag.width)/10)*10;
 update();
};
function finishDrag(e){
 if(!drag||drag.id!==e.pointerId)return;
 drag=null;spectrum.classList.remove('dragging');
}
spectrum.onpointerup=finishDrag;
spectrum.onpointercancel=finishDrag;
spectrum.onlostpointercapture=finishDrag;
</script></html>
